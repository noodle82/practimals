workflows:
  ios-testflight:
    name: Spelloids iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: "22"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.spelloids.spelling
    scripts:
      - name: Install pinned dependencies
        script: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check learning and voice assets
        script: npm test
      - name: Build app and create iPhone/iPad project
        script: npm run ios:prepare
      - name: Verify speech in a running iOS simulator
        script: node scripts/test-ios-speech-simulator.mjs
      - name: Apply distribution signing
        script: xcode-project use-profiles
      - name: Create signed Apple build
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/speech-diagnostics/**
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  ios-family-adhoc:
    name: Spelloids Family iPad — Ad Hoc
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: "22"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.spelloids.spelling
    scripts:
      - name: Install pinned dependencies
        script: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify learning rules and native configuration
        script: |
          npm test
          node scripts/prepare-ios.mjs --check
      - name: Bundle app and create iPhone and iPad project
        script: npm run ios:prepare
      - name: Verify speech in a running iOS simulator
        script: node scripts/test-ios-speech-simulator.mjs
      - name: Apply distribution signing
        script: xcode-project use-profiles
      - name: Build signed IPA for registered family devices
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/speech-diagnostics/**
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-speech-diagnostic:
    name: Spelloids — speech diagnostic only (no TestFlight upload)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: "22"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install pinned dependencies
        script: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source and exact Capacitor startup template
        script: npm test
      - name: Prepare native iOS project
        script: npm run ios:prepare
      - name: Test the running app and actual native speech engine
        script: node scripts/test-ios-speech-simulator.mjs
    artifacts:
      - build/speech-diagnostics/**

  ios-family-reuse-build30:
    name: Spelloids Family iPad — reuse working build 30
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    inputs:
      source_ipa_url:
        description: Paste the App.ipa artifact download link from the successful Spelloids build 30
        type: string
    environment:
      node: "22"
      xcode: latest
      vars:
        SPELLOIDS_SOURCE_IPA_URL: ${{ inputs.source_ipa_url }}
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.spelloids.spelling
    scripts:
      - name: Re-sign and verify the existing working app for the registered family iPad
        script: node scripts/reuse-spelloids-ipa.mjs
    artifacts:
      - build/ios/ipa/*.ipa
      - build/family-reuse-report.json
